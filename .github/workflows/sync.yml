name: Sync

# 全国の zip は約 100GB あり、ランナーでは毎回取り直しになるので、自動では回さない。
# 原典の更新は年 1 回（春）なので、手で回す
on:
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: moj
      timeout_minutes: 360
    secrets: inherit
