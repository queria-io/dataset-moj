name: Sync

# 全国の zip は約 100GB あり、ランナーでは毎回取り直しになるので、自動では回さない。
# 原典の更新は年 1 回（春）なので、手で回す
on:
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria のトークンを GitHub Actions の OIDC で取る (dataset-shared の scripts/queria_token.py)
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@67443c88b6ec355559c91bf866239e10073ccf83
    with:
      dataset_name: moj
      timeout_minutes: 360
      # 新しいデータファイル (全国で約 17.5GB) を push まで手元に置くことがあるので、ディスクを空ける
      free_disk: true
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
