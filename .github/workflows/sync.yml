name: Sync

# 全国の zip は約 100GB あり、ランナーでは毎回取り直しになるので、自動では回さない。
# 原典の更新は年 1 回（春）なので、手で回す
on:
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria のトークンを GitHub Actions の OIDC で取る (dataset-shared の scripts/queria_token.py)
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@fe59be721647d5b1bbffe1ef3eb2d318c81be3f3
    with:
      dataset_name: moj
      timeout_minutes: 360
      # 新しいデータファイル (全国で約 17.5GB) を push まで手元に置くことがあるので、ディスクを空ける
      free_disk: true
    secrets:
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
