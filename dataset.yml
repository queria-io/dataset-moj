# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: moj
title: 法務省 登記所備付地図
description: |-
  法務局が備え付けている地図（登記所備付地図）の電子データです。全国の筆（土地の 1 区画）ごとに地番・座標系・精度区分を収録し、公共座標の図面の筆は形と代表点の緯度経度を持ちます。

  出典：「登記所備付地図データ」（法務省）。市区町村ごとのデータ名と URL は chizu.source にあります。Queria が加工したものです。
keywords:
  - 登記所備付地図
  - 地図XML
  - 公図
  - 14条地図
  - 筆
  - 地番
  - 土地
  - 不動産登記
  - 法務省
  - 法務局
homepage: https://github.com/queria-io/dataset-moj
language: ja

licenses:
  - id: JP-MOJ-CHIZU
    url: https://www.moj.go.jp/MINJI/minji05_00494.html
    title: 登記所備付地図データ利用規約（法務省）
    commercial_use: true
    share_alike: false
    attribution_required: true

sources:
  - title: 法務省 地図データのＧ空間情報センターを介した一般公開について
    path: https://www.moj.go.jp/MINJI/minji05_00494.html
  - title: G空間情報センター
    path: https://front.geospatial.jp/

contributors:
  - title: 法務省
    path: https://www.moj.go.jp/
    roles: [rightsHolder]

update_frequency: yearly

schemas:
  - name: chizu
    title: 登記所備付地図

annotations:
  queria:
    themes: [housing_land]
    cover: 🗺️
