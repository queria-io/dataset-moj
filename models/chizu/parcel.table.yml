schema: chizu
name: parcel
title: 筆
description: |-
  登記所備付地図の筆（土地の 1 区画）です。1 行が 1 筆で、地番・座標系・精度区分と、公共座標の図面の筆は形と代表点を持ちます。

  - 任意座標系の図面の筆は形が NULL です（全国では 53%、東京都では 9 割）
  - 1 筆を示すキーは (file, fude_id) です。地番は図面をまたいで重なることがあります
  - 他の情報と照合して特定の個人を識別する使い方は、利用規約で禁止されています
primary_key: [file, fude_id]
fields:
  - name: city_code
    title: 市区町村コード（5 桁）
    description: 原典の市区町村コード（検査数字なし）
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: lg_code
    title: 全国地方公共団体コード
    description: city_code に検査数字を付けた 6 桁
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: city_name
    title: 市区町村名
    description: 原典の市区町村名。合併前の名前のことがあります
  - name: oaza_code
    title: 大字コード
    description: 法務局が付けた、市区町村の中で大字を表すコード
  - name: chome_code
    title: 丁目コード
  - name: koaza_code
    title: 小字コード
  - name: yobi_code
    title: 予備コード
  - name: oaza
    title: 大字名
  - name: chome
    title: 丁目名
    description: 原典のまま全角数字（「３丁目」）
  - name: koaza
    title: 小字名
  - name: yobi
    title: 予備名
  - name: chiban
    title: 地番
    description: 原典のまま（「147-2」「道-10」「筆界未定地-24」「地区外」など）
  - name: crs
    title: 座標系
    description: 任意座標系、または公共座標1系〜19系
  - name: datum
    title: 測地系判別
    description: 公共座標の図面の測地系。原典のまま
  - name: accuracy
    title: 精度区分
    description: 甲一・甲二・乙一など。甲に近く数字が小さいほど高精度
  - name: coord_type
    title: 座標値種別
    description: 測量成果か図上測量か
  - name: undetermined_members
    title: 筆界未定の構成筆
    description: 筆界未定地のとき、もとの筆の一覧。それ以外は NULL
  - name: geometry
    title: ジオメトリ
    description: 筆の形（経緯度 JGD2011）。任意座標系の筆は NULL
  - name: lng
    title: 経度
    description: 代表点（筆の内側に取った点）。任意座標系の筆は NULL
  - name: lat
    title: 緯度
    description: 代表点（筆の内側に取った点）。任意座標系の筆は NULL
  - name: map_name
    title: 地図名
    description: 原典の図面の名前
  - name: file
    title: ファイル名
    description: 筆が載っている地図 XML のファイル名
  - name: fude_id
    title: 筆 ID
    description: 地図 XML の中の筆の ID。ファイルの中だけで一意
